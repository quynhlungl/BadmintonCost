<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chia Tiền Cầu Lông</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --court-green: #1F5C4A;
    --court-green-dark: #123B30;
    --line-white: #F6F4EC;
    --shuttle-cream: #FBF8F1;
    --net-gold: #E7B84E;
    --ink: #10241D;
    --muted: #6C8A7F;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family:'Be Vietnam Pro', sans-serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(231,184,78,0.10), transparent 40%),
      linear-gradient(180deg, var(--court-green-dark) 0%, var(--court-green) 55%, var(--court-green-dark) 100%);
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
    position:relative;
    overflow-x:hidden;
  }
  body::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:
      linear-gradient(rgba(246,244,236,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(246,244,236,0.06) 1px, transparent 1px);
    background-size:48px 48px;
    pointer-events:none;
  }
  .center-line{
    position:absolute;
    top:0; bottom:0; left:50%;
    width:2px;
    background:rgba(246,244,236,0.12);
    transform:translateX(-50%);
    pointer-events:none;
  }
  .net-line{
    position:absolute;
    left:0; right:0; top:50%;
    height:0;
    border-top:2px dashed rgba(231,184,78,0.18);
    transform:translateY(-50%);
    pointer-events:none;
  }
  .card{
    position:relative;
    width:100%;
    max-width:440px;
    background:var(--shuttle-cream);
    border-radius:20px;
    box-shadow:0 30px 60px rgba(0,0,0,0.35), 0 0 0 1px rgba(255,255,255,0.06);
    overflow:hidden;
    z-index:1;
  }
  .header{
    background:var(--court-green);
    padding:28px 28px 40px;
    position:relative;
    text-align:center;
    color:var(--line-white);
  }
  .header::after{
    content:"";
    position:absolute;
    left:50%;
    bottom:-1px;
    transform:translateX(-50%);
    width:80%;
    height:2px;
    background:rgba(246,244,236,0.25);
  }
  .shuttle-icon{
    width:44px;
    height:44px;
    margin:0 auto 10px;
    display:block;
    animation:spin-shuttle 6s linear infinite;
    transform-origin:50% 60%;
  }
  @keyframes spin-shuttle{
    0%,85%,100%{ transform:rotate(0deg); }
    90%{ transform:rotate(8deg); }
    95%{ transform:rotate(-6deg); }
  }
  h1{
    margin:0;
    font-family:'Oswald', sans-serif;
    font-size:22px;
    font-weight:700;
    letter-spacing:0.5px;
    text-transform:uppercase;
  }
  .subtitle{
    margin:6px 0 0;
    font-size:13px;
    color:rgba(246,244,236,0.75);
  }
  .body{
    padding:28px;
  }
  .field{
    margin-bottom:26px;
  }
  .field label{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    font-size:13px;
    font-weight:600;
    color:var(--court-green-dark);
    margin-bottom:6px;
  }
  .field label .hint{
    font-weight:400;
    font-size:11px;
    color:var(--muted);
  }
  .input-wrap{
    position:relative;
    display:flex;
    align-items:center;
  }
  .input-wrap .unit{
    position:absolute;
    right:14px;
    font-size:13px;
    color:var(--muted);
    font-weight:500;
    pointer-events:none;
  }
  input[type=number], input[type=text]{
    width:100%;
    padding:16px 52px 16px 16px;
    border-radius:12px;
    border:1.5px solid #DDE6DF;
    font-family:'Be Vietnam Pro', sans-serif;
    font-size:17px;
    font-weight:600;
    color:var(--ink);
    background:#fff;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input[type=number]:focus, input[type=text]:focus{
    outline:none;
    border-color:var(--court-green);
    box-shadow:0 0 0 3px rgba(31,92,74,0.12);
  }
  input[type=number]::-webkit-inner-spin-button{
    opacity:1;
  }
  .stepper{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .stepper button{
    width:38px;
    height:38px;
    flex:none;
    border-radius:10px;
    border:1.5px solid #DDE6DF;
    background:#fff;
    color:var(--court-green-dark);
    font-size:18px;
    font-weight:700;
    cursor:pointer;
    transition:background .15s ease, transform .1s ease;
  }
  .stepper button:active{ transform:scale(0.92); }
  .stepper button:hover{ background:#EFF5F1; }
  .stepper input{
    text-align:center;
    padding:16px 14px;
    font-size:17px;
  }
  .divider{
    border:none;
    border-top:1px dashed #DDE6DF;
    margin:22px 0;
  }
  .result{
    background:linear-gradient(135deg, var(--court-green) 0%, var(--court-green-dark) 100%);
    border-radius:14px;
    padding:20px 22px;
    color:var(--line-white);
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .result .label{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:rgba(246,244,236,0.7);
    font-weight:600;
  }
  .result .amount{
    font-family:'Oswald', sans-serif;
    font-size:34px;
    font-weight:700;
    margin:6px 0 2px;
    color:var(--net-gold);
    letter-spacing:0.5px;
  }
  .result .per{
    font-size:12px;
    color:rgba(246,244,236,0.65);
  }
  .breakdown{
    margin-top:16px;
    display:flex;
    justify-content:space-between;
    font-size:12.5px;
    color:var(--muted);
    padding-top:12px;
    border-top:1px solid rgba(255,255,255,0.12);
  }
  footer{
    text-align:center;
    font-size:11px;
    color:rgba(246,244,236,0.4);
    margin-top:18px;
  }
</style>
</head>
<body>
  <div class="center-line"></div>
  <div class="net-line"></div>

  <div class="card">
    <div class="header">
      <svg class="shuttle-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M32 40 L20 58" stroke="#F6F4EC" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M32 40 L44 58" stroke="#F6F4EC" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M32 40 L32 60" stroke="#F6F4EC" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="32" cy="59" r="2.2" fill="#E7B84E"/>
        <circle cx="20" cy="58" r="2.2" fill="#E7B84E"/>
        <circle cx="44" cy="58" r="2.2" fill="#E7B84E"/>
        <path d="M32 40 C 18 34, 14 20, 22 8 C 24 20, 30 30, 32 40 Z" fill="#F6F4EC"/>
        <path d="M32 40 C 24 32, 24 18, 32 6 C 34 18, 36 30, 32 40 Z" fill="#FBF8F1"/>
        <path d="M32 40 C 46 34, 50 20, 42 8 C 40 20, 34 30, 32 40 Z" fill="#F6F4EC"/>
        <ellipse cx="32" cy="42" rx="6" ry="5" fill="#C97B3D"/>
      </svg>
      <h1>Chia Tiền Cầu Lông</h1>
      <p class="subtitle">Sân · Cầu · Nước — chia đều, khỏi lăn tăn</p>
    </div>

    <div class="body">
      <div class="field">
        <label>Số người chơi <span class="hint">tối thiểu 1</span></label>
        <div class="stepper">
          <button type="button" onclick="step(-1)">−</button>
          <input type="number" id="players" value="10" min="1" oninput="calc()">
          <button type="button" onclick="step(1)">+</button>
        </div>
      </div>

      <div class="field">
        <label>Tiền sân</label>
        <div class="input-wrap">
          <input type="text" inputmode="numeric" id="court" placeholder="0" oninput="formatMoneyInput(this)">
          <span class="unit">đ</span>
        </div>
      </div>

      <div class="field">
        <label>Tiền cầu</label>
        <div class="input-wrap">
          <input type="text" inputmode="numeric" id="shuttle" placeholder="0" oninput="formatMoneyInput(this)">
          <span class="unit">đ</span>
        </div>
      </div>

      <div class="field">
        <label>Tiền nước</label>
        <div class="input-wrap">
          <input type="text" inputmode="numeric" id="water" placeholder="0" oninput="formatMoneyInput(this)">
          <span class="unit">đ</span>
        </div>
      </div>

      <hr class="divider">

      <div class="result">
        <div class="label">Mỗi người trả</div>
        <div class="amount" id="perPerson">0 đ</div>
        <div class="per" id="playerCount">chia cho 10 người</div>
        <div class="breakdown">
          <span>Tổng chi phí</span>
          <span id="totalAmount">0 đ</span>
        </div>
      </div>
    </div>
  </div>

<script>
function formatVND(n){
  if(isNaN(n)) n = 0;
  return Math.round(n).toLocaleString('vi-VN') + ' đ';
}

function parseMoney(v){
  return parseFloat((v || '').toString().replace(/\./g, '').replace(/,/g, '')) || 0;
}

function formatMoneyInput(el){
  const cursorFromEnd = el.value.length - el.selectionStart;
  const digits = el.value.replace(/\D/g, '');
  const formatted = digits ? Number(digits).toLocaleString('vi-VN') : '';
  el.value = formatted;
  const pos = Math.max(0, el.value.length - cursorFromEnd);
  el.setSelectionRange(pos, pos);
  calc();
}

function step(delta){
  const el = document.getElementById('players');
  let v = parseInt(el.value || '0', 10) + delta;
  if(v < 1) v = 1;
  el.value = v;
  calc();
}

function calc(){
  const players = Math.max(1, parseInt(document.getElementById('players').value) || 1);
  const court = parseMoney(document.getElementById('court').value);
  const shuttle = parseMoney(document.getElementById('shuttle').value);
  const water = parseMoney(document.getElementById('water').value);

  const total = court + shuttle + water;
  const per = total / players;

  document.getElementById('perPerson').textContent = formatVND(per);
  document.getElementById('totalAmount').textContent = formatVND(total);
  document.getElementById('playerCount').textContent = 'chia cho ' + players + ' người';
}

calc();
</script>
</body>
</html>
